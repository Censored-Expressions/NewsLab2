services:
  - type: web
    name: censored-expressions-web
    runtime: node
    buildCommand: yarn
    startCommand: yarn start
    envVars:
      - key: OWNER_ADMIN_TOKEN
        sync: false
      - key: NEWSLETTER_ADMIN_TOKEN
        sync: false
      - key: PUBLIC_SITE_URL
        value: https://censoredexpressionsmedia.com
      - key: CE_DATA_DIR
        value: /var/data/censored-expressions
      - key: CE_RENDER_EMBEDDED_WORKER_FALLBACK
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: CE_WORKER_SYNC_BODY_LIMIT_BYTES
        value: "16777216"
      - key: CE_WORKER_SYNC_MAX_FILE_BYTES
        value: "16777216"
      - key: CE_NEWS_LAB_LIVE_IMAGES
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
      - key: NEWSDATA_API_KEY
        sync: false

  - type: worker
    name: censored-expressions-news-lab-worker
    runtime: node
    buildCommand: yarn
    startCommand: yarn worker
    envVars:
      - key: OWNER_ADMIN_TOKEN
        sync: false
      - key: NEWSLETTER_ADMIN_TOKEN
        sync: false
      - key: PUBLIC_SITE_URL
        value: https://censoredexpressionsmedia.com
      - key: CE_WEB_SYNC_URL
        value: https://censoredexpressionsmedia.com
      - key: CE_WORKER_SYNC_ENABLED
        value: "true"
      - key: CE_WORKER_SYNC_TIMEOUT_MS
        value: "20000"
      - key: CE_NEWS_LAB_LIVE_IMAGES
        value: "true"
      - key: CE_WORKER_CPU_GUARD
        value: "true"
      - key: CE_WORKER_MAX_COLLECTORS
        value: "4"
      - key: CE_WORKER_COLLECTOR_ROTATION_MS
        value: "120000"
      - key: CE_NEWS_LAB_MICRO_SOURCE_LIMIT
        value: "48"
      - key: CE_NEWS_LAB_MICRO_CLUSTER_LIMIT
        value: "10"
      - key: CE_NEWS_LAB_CATCHUP_SOURCE_LIMIT
        value: "180"
      - key: CE_NEWS_LAB_CATCHUP_CLUSTER_LIMIT
        value: "32"
      - key: CE_NEWS_LAB_PRODUCTION_BUDGET_MS
        value: "75000"
      - key: CE_NEWS_LAB_WORKER_FULL_READS
        value: "true"
      - key: CE_NEWS_LAB_WORKER_LIVE_IMAGES
        value: "false"
      - key: CE_WORKER_MIN_COLLECTORS
        value: "1"
      - key: CE_WORKER_ROLE_STARTUP_STAGGER_MS
        value: "4500"
      - key: CE_WORKER_MAX_ONESHOT_CONCURRENCY
        value: "1"
      - key: CE_WORKER_PRESSURE_FAILURE_THRESHOLD
        value: "2"
      - key: CE_WORKER_PRESSURE_RECOVERY_THRESHOLD
        value: "3"
      - key: CE_WORKER_PRESSURE_DEFER_MS
        value: "900000"
      - key: CE_WORKER_PRESSURE_HARD_DEFER_MS
        value: "1800000"
      - key: CE_KNOWLEDGE_DISTILLATION_STARTUP_DELAY_MS
        value: "1800000"
      - key: CE_KNOWLEDGE_DISTILLATION_INTERVAL_MS
        value: "21600000"
      - key: CE_EVOLUTION_ENGINE_STARTUP_DELAY_MS
        value: "2700000"
      - key: CE_EVOLUTION_ENGINE_INTERVAL_MS
        value: "14400000"
      - key: CE_IMAGE_WORKER_STARTUP_DELAY_MS
        value: "900000"
      - key: CE_IMAGE_WORKER_INTERVAL_MS
        value: "3600000"
      - key: CE_NEWS_LAB_IMAGE_LOOKUP_MS
        value: "3500"
      - key: CE_NEWS_LAB_IMAGE_WORKER_LIMIT
        value: "24"
      - key: OPENAI_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
      - key: NEWSDATA_API_KEY
        sync: false







